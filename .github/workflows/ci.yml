name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check src/ ai/ tests/ dashboard/ scripts/ flows/

      - name: Ruff format check
        run: ruff format --check src/ ai/ tests/ dashboard/ scripts/ flows/

      - name: Mypy
        run: mypy src/ ai/

      - name: Pytest with coverage
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Pipeline smoke test
        run: python -m src.pipeline

      - name: Build Docker image
        run: docker build -t financial-operations-analytics .
